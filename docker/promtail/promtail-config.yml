server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Scrape Docker container logs
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        target_label: container
      - source_labels: ["__meta_docker_container_log_stream"]
        target_label: stream
      - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
        target_label: service

  # Scrape log files from the Express app
  - job_name: app-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: express-api
          service: express-api
          environment: production
          __path__: /var/log/app/*.log

    pipeline_stages:
      - json:
          expressions:
            level: level
            service: service
            environment: environment
            requestId: requestId
            userId: userId
            method: "req.method"
            url: "req.url"
            statusCode: "res.statusCode"
            module: "audit.module"
            action: "audit.action"
            type: type
      - labels:
          level:
          service:
          environment:
          module:
          type:
      - timestamp:
          source: time
          format: RFC3339Nano
