services:
  # Express API
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: express-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - NODE_ENV=production
      - PORT=8000
      - MONGODB_URI=mongodb://mongo:27017/demo
      - JWT_SECRET=${JWT_SECRET:-change-this-to-a-secure-random-string}
      - LOG_LEVEL=info
      - LOG_DIR=logs
      - SERVICE_NAME=express-api
      - ENABLE_LOKI=false
    volumes:
      - app-logs:/app/logs
    depends_on:
      mongo:
        condition: service_healthy
    labels:
      - "logging=promtail"
    networks:
      - app-network

  # MongoDB
  mongo:
    image: mongo:8
    container_name: mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: mongosh --eval "db.adminCommand('ping')" --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # Loki (Log aggregation)
  loki:
    image: grafana/loki:3.5.0
    container_name: loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    healthcheck:
      test: wget -qO- http://localhost:3100/ready || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # Promtail (Log shipper)
  promtail:
    image: grafana/promtail:3.5.0
    container_name: promtail
    restart: unless-stopped
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml
      - app-logs:/var/log/app:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      loki:
        condition: service_healthy
    networks:
      - app-network

  # Grafana (Dashboards)
  grafana:
    image: grafana/grafana:11.6.0
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/provisioning/dashboards:/var/lib/grafana/dashboards
      - grafana-data:/var/lib/grafana
    depends_on:
      loki:
        condition: service_healthy
    networks:
      - app-network

volumes:
  mongo-data:
  app-logs:
  loki-data:
  grafana-data:

networks:
  app-network:
    driver: bridge
