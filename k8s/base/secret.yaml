apiVersion: v1
kind: Secret
metadata:
  name: express-api-secret
type: Opaque
# Values are base64-encoded. Replace with real secrets before deploying.
# Generate: echo -n 'your-value' | base64
stringData:
  MONGODB_URI: "mongodb://mongo:27017/express-api"
  JWT_SECRET: "CHANGE-ME-to-a-secure-random-string"
  JWT_REFRESH_SECRET: "CHANGE-ME-to-another-secure-random-string"
  SMTP_USER: ""
  SMTP_PASS: ""
  AWS_ACCESS_KEY_ID: ""
  AWS_SECRET_ACCESS_KEY: ""
  AWS_S3_BUCKET: ""
  FCM_PROJECT_ID: ""
  FCM_PRIVATE_KEY: ""
  FCM_CLIENT_EMAIL: ""
