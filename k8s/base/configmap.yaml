apiVersion: v1
kind: ConfigMap
metadata:
  name: express-api-config
data:
  NODE_ENV: "production"
  PORT: "8000"
  APP_NAME: "Express API"
  LOG_LEVEL: "info"
  LOG_DIR: "logs"
  SERVICE_NAME: "express-api"
  LOG_RETENTION_DAYS: "30"
  ENABLE_LOKI: "false"
  METRICS_ENABLED: "true"
  TRACING_ENABLED: "false"
  SMTP_HOST: "smtp.gmail.com"
  SMTP_PORT: "587"
  SMTP_FROM: "noreply@example.com"
  AWS_REGION: "us-east-1"
